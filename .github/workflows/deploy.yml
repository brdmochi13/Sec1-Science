name: Deploy to GitHub Pages and Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment

  embed-and-deploy-cloudflare:
    name: Embed HTML into worker and deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate index.html before building
        run: |
          python3 << 'PYEOF'
          import re, sys
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          errors = []
          # 1. Check doAuth exists
          if 'function doAuth()' not in html:
              errors.append('MISSING: function doAuth()')
          # 2. Check Firebase config
          if 'sec-science.firebaseapp.com' not in html:
              errors.append('MISSING: Firebase config')
          # 3. Check sign in button
          if 'onclick="doAuth()"' not in html:
              errors.append('MISSING: Sign in button onclick doAuth')
          # 4. Count script braces
          for i, m in enumerate(re.finditer(r'<script[^>]*>([\s\S]*?)</script>', html)):
              s = m.group(1)
              balance = s.count('{') - s.count('}')
              if balance != 0:
                  errors.append(f'Script block {i+1}: unbalanced braces by {balance}')
          # 5. Check for unescaped backticks outside the known escaped ones
          raw_ticks = len(re.findall(r'(?<!\\)`', html))
          if raw_ticks > 6:
              errors.append(f'TOO MANY BACKTICKS: {raw_ticks} (max 6 allowed)')
          if errors:
              print('VALIDATION FAILED:')
              for e in errors: print(' -', e)
              sys.exit(1)
          else:
              print(f'Validation passed: {len(html):,} chars, all checks OK')
          PYEOF

      - name: Build worker.js with embedded HTML (base64 — safe against backticks)
        run: |
          python3 << 'EOF'
          import base64
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          b64 = base64.b64encode(html.encode('utf-8')).decode('ascii')
          worker = (
              '// Auto-generated\n'
              'const B64="' + b64 + '";\n'
              'function b64decode(s){const b=atob(s);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder("utf-8").decode(a);}\n'
              'export default{async fetch(r,e){return new Response(b64decode(B64),{headers:{"Content-Type":"text/html;charset=UTF-8","Cache-Control":"no-cache, no-store, must-revalidate"}});}}; \n'
          )
          with open('worker.js', 'w', encoding='utf-8') as f:
              f.write(worker)
          print(f'worker.js: {len(worker)} chars, HTML: {len(html)} chars')
          EOF

      - name: Commit worker.js
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add worker.js
          git diff --cached --quiet || git commit -m "ci: auto-embed index.html into worker.js [skip ci]"
          git push

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
